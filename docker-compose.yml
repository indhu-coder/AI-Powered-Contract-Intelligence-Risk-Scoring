version: '3.8'

services:
  # Redis Message Broker & Cache for Asynchronous Celery Workers
  redis:
    image: redis:7-alpine
    container_name: contractiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - contractiq-net

  # Production FastAPI REST Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contractiq-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - contractiq-net

  # Celery Asynchronous Task Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contractiq-worker
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - contractiq-net

  # Streamlit Interactive Intelligence Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contractiq-ui
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - contractiq-net

volumes:
  redis_data:
    driver: local

networks:
  contractiq-net:
    driver: bridge
